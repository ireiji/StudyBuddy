<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Study Buddy — Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
    <meta name='viewport' content='width=device-width, initial-scale=1'>

    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #0d0f14;
            color: #e8eaf0;
            display: flex;
            height: 100dvh;
            overflow: hidden;
        }

        .main {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }

        .topbar {
            height: 64px;
            background: #13161e;
            border-bottom: 1px solid #222636;
            display: flex; align-items: center;
            padding: 0 24px; gap: 16px; flex-shrink: 0;
            width: 100%;
        }

        .page-title { 
            font-family: 'Syne', sans-serif; 
            font-weight: 700; 
            font-size: 18px; 
            color: #e8eaf0;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 32px 28px;
            scrollbar-width: thin;
            scrollbar-color: #222636 transparent;
            min-height: 0;
        }
        .content::-webkit-scrollbar { width: 6px; }
        .content::-webkit-scrollbar-thumb { background: #222636; border-radius: 3px; }

        .greeting { 
            margin-bottom: 32px; 
        }
        .greeting h1 { 
            font-family: 'Syne', sans-serif; 
            font-size: clamp(22px, 3vw, 30px); 
            font-weight: 800; 
            letter-spacing: -.4px; 
        }
        .greeting p { 
            color: #636882; 
            margin-top: 4px; 
            font-size: 14.5px; 
        }

        @media (max-width: 768px) {
            .content { padding: 20px 16px; }
            .topbar  { padding: 0 16px; }
        }

        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 16px; 
            margin-bottom: 28px; 
        }
        .stat-card { 
            background: #13161e; 
            border: 1px solid #222636; 
            border-radius: 14px; 
            padding: 20px; 
            transition: border-color .2s, transform .2s; 
        }
        .stat-card:hover { 
            border-color: #6c8ef4; 
            transform: translateY(-2px); 
        }
        .stat-icon  { font-size: 22px; margin-bottom: 14px; }
        .stat-value { 
            font-family: 'Syne', sans-serif; 
            font-size: 28px; 
            font-weight: 800; 
            letter-spacing: -.5px; 
        }
        .stat-label { color: #636882; font-size: 12.5px; margin-top: 4px; }

        .two-col { 
            display: grid; 
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: start;
        }
        @media (max-width: 900px) { 
            .two-col { grid-template-columns: 1fr; } 
        }

        /* ── CARD ── */
        .card { 
            background: #13161e; 
            border: 1px solid #222636; 
            border-radius: 14px; 
            padding: 22px;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* Task card: fixed height with internal scroll */
        .task-card {
            height: 400px;
        }

        .card-title { 
            font-family: 'Syne', sans-serif; 
            font-weight: 700; 
            font-size: 15px; 
            margin-bottom: 14px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            flex-shrink: 0;
        }
        .see-all { 
            font-family: 'DM Sans', sans-serif; 
            font-size: 12px; 
            color: #6c8ef4; 
            font-weight: 400; 
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Scrollable task list */
        .task-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 0;
            scrollbar-width: thin;
            scrollbar-color: #222636 transparent;
        }
        .task-list::-webkit-scrollbar { width: 4px; }
        .task-list::-webkit-scrollbar-thumb { background: #222636; border-radius: 2px; }

        /* ── TASK ITEM ── */
        .task-item { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            padding: 10px 0; 
            border-bottom: 1px solid #222636;
            min-width: 0; /* critical: lets children shrink */
        }
        .task-item:last-child { border-bottom: none; }

        .task-check {
            width: 18px; height: 18px; border-radius: 5px;
            border: 2px solid #222636; flex-shrink: 0; cursor: pointer;
            display: grid; place-items: center;
            transition: border-color .2s, background .2s;
        }
        .task-check.done { background: #6c8ef4; border-color: #6c8ef4; }
        .task-check.done::after { content: '✓'; font-size: 11px; color: #fff; }

        /* Task text: takes remaining space, truncates if too long */
        .task-text { 
            font-size: 13.5px; 
            flex: 1;
            min-width: 0;          /* critical: allows truncation */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .task-edit {
            border: 1px solid rgba(108,142,244,.25);
            background: rgba(108,142,244,.12);
            color: #6c8ef4;
            width: 24px; height: 24px;
            border-radius: 6px;
            display: grid; place-items: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background .2s, transform .2s;
            font-size: 13px;
        }
        .task-edit:hover { background: rgba(108,142,244,.24); transform: scale(.97); }

        .task-delete {
            margin-left: 0;
            border: 1px solid rgba(255,255,255,.18);
            background: rgba(255,255,255,.06);
            color: #f87171;
            width: 24px; height: 24px;
            border-radius: 6px;
            display: grid; place-items: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background .2s, transform .2s;
            font-size: 13px;
        }
        .task-delete:hover { background: rgba(248,113,113,.18); transform: scale(.97); }

        /* ── MODAL ── */
        .panel-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,.6);
            backdrop-filter: blur(4px);
            z-index: 80;
            opacity: 0; pointer-events: none;
            transition: opacity .25s;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .panel-overlay.show { opacity: 1; pointer-events: all; }

        .add-task-panel {
            width: 100%; max-width: 440px;
            background: rgba(19,22,30,.9);
            backdrop-filter: blur(28px) saturate(1.5);
            -webkit-backdrop-filter: blur(28px) saturate(1.5);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 20px;
            box-shadow: 0 0 0 1px rgba(108,142,244,.08),
                        0 32px 64px rgba(0,0,0,.6),
                        inset 0 1px 0 rgba(255,255,255,.06);
            z-index: 90;
            display: flex; flex-direction: column;
            opacity: 0;
            transform: scale(.95) translateY(12px);
            transition: opacity .25s, transform .25s cubic-bezier(.34,1.56,.64,1);
            pointer-events: none;
        }
        .panel-overlay.show .add-task-panel {
            opacity: 1; transform: scale(1) translateY(0); pointer-events: all;
        }

        .panel-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 24px 24px 20px;
            border-bottom: 1px solid rgba(255,255,255,.06);
            flex-shrink: 0;
        }
        .panel-header h2 {
            font-family: 'Syne', sans-serif;
            font-weight: 800; font-size: 18px; letter-spacing: -.3px;
        }
        .panel-close {
            width: 32px; height: 32px; border-radius: 8px;
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.09);
            color: #636882; font-size: 17px;
            cursor: pointer; display: grid; place-items: center;
            transition: background .2s, color .2s, border-color .2s;
        }
        .panel-close:hover { background: rgba(248,113,113,.12); border-color: rgba(248,113,113,.3); color: #f87171; }

        .panel-body {
            padding: 20px 24px;
            display: flex; flex-direction: column; gap: 16px;
        }

        .pf { display: flex; flex-direction: column; gap: 7px; }
        .pf label {
            font-size: 12.5px; font-weight: 600;
            letter-spacing: .03em; color: #636882;
            text-transform: uppercase;
        }
        .pf input, .pf textarea, .pf select {
            width: 100%;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 10px;
            padding: 11px 14px;
            color: #e8eaf0;
            font-family: 'DM Sans', sans-serif; font-size: 14px;
            outline: none;
            transition: border-color .2s, background .2s, box-shadow .2s;
            resize: none;
        }
        .pf input::placeholder, .pf textarea::placeholder { color: #636882; }
        .pf input:focus, .pf textarea:focus, .pf select:focus {
            border-color: rgba(108,142,244,.5);
            background: rgba(108,142,244,.06);
            box-shadow: 0 0 0 3px rgba(108,142,244,.1);
        }
        .date-input { color-scheme: dark; }

        .panel-footer {
            padding: 16px 24px 24px;
            border-top: 1px solid rgba(255,255,255,.06);
            display: flex; gap: 10px; flex-shrink: 0;
        }
        .btn-cancel {
            flex: 1; padding: 12px;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 10px;
            color: #636882; font-family: 'DM Sans', sans-serif;
            font-size: 14px; font-weight: 500; cursor: pointer;
            transition: background .2s, color .2s, border-color .2s;
        }
        .btn-cancel:hover { background: rgba(255,255,255,.08); color: #e8eaf0; border-color: rgba(255,255,255,.15); }
        .btn-add {
            flex: 2; padding: 12px;
            background: linear-gradient(135deg, #6c8ef4, #a78bfa);
            border: none; border-radius: 10px;
            color: #fff; font-family: 'Syne', sans-serif;
            font-size: 14px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 16px rgba(108,142,244,.3);
            transition: opacity .2s, transform .15s, box-shadow .2s;
            position: relative; overflow: hidden;
        }
        .btn-add::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,.15), transparent 60%);
            opacity: 0; transition: opacity .2s;
        }
        .btn-add:hover { opacity: .92; box-shadow: 0 6px 24px rgba(108,142,244,.4); }
        .btn-add:hover::before { opacity: 1; }
        .btn-add:active { transform: scale(.98); }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .task-item.new-task { animation: fadeSlideIn .3s ease both; }
    </style>
</head>
<body>
    <div class="main">
        <div class="topbar">
            <span class="page-title">Dashboard</span>
        </div>

        <div class="content">
            <div class="greeting">
                <h1 id="greet">Good [time], [user] 👋</h1>
                <p id="greetsub">Here are your tasks for today.</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card"><div class="stat-icon">💗</div><div class="stat-value" id="partnername">[partner]</div><div class="stat-label" id="partnerstatus">checking status</div></div>
                <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-value" id="statFinished">0</div><div class="stat-label">Tasks finished this week</div></div>
                <div class="stat-card"><div class="stat-icon">❌</div><div class="stat-value" id="statUnfinished">0</div><div class="stat-label">Tasks unfinished</div></div>
                <div class="stat-card"><div class="stat-icon">💀</div><div class="stat-value" id="statDeadlines">0</div><div class="stat-label">Deadlines this week</div></div>
            </div>

            <div class="two-col">
                <!-- Task card: fixed height, internally scrollable -->
                <div class="card task-card">
                    <div class="card-title">
                        Today's Tasks <span class="see-all">Add new +</span>
                    </div>
                    <div class="task-list" id="taskList">
                        <!-- tasks injected here by JS -->
                    </div>
                </div>

                <div class="card">
                    <!-- second column content -->
                </div>
            </div>
        </div>
    </div>

    <div class="panel-overlay" id="panelOverlay" onclick="handleOverlayClick(event)">
        <div class="add-task-panel" id="addTaskPanel">
            <div class="panel-header">
                <h2>✦ New Task</h2>
                <button class="panel-close" onclick="closePanel()">✕</button>
            </div>

            <div class="panel-body">
                <div class="pf">
                    <label>Task title</label>
                    <input type="text" id="taskTitle" placeholder="e.g. Redesign onboarding screen" />
                </div>
                <div class="pf">
                    <label>Description</label>
                    <textarea id="taskDesc" rows="3" placeholder="Add some context or notes…"></textarea>
                </div>
                <div class="pf">
                    <label>Due date &amp; time</label>
                    <input type="datetime-local" id="taskDate" class="date-input" />
                </div>
            </div>

            <div class="panel-footer">
                <button class="btn-cancel" onclick="closePanel()">Cancel</button>
                <button class="btn-add" id="panelSubmitBtn" onclick="submitTask()">Add Task</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabaseUrl = "https://wfsnvttpktwwelsjghqf.supabase.co"
        const supabaseKey = "sb_publishable_ymCf8rQ5UaHKzOLSa_5srA_R-g9thvB"

        const supabase = createClient(supabaseUrl, supabaseKey)

        const user = JSON.parse(localStorage.getItem("user"))

        if (!user) {
            window.location.href = "login.html"
        }

        const isBF = user.role === "bf";
        const isGF = user.role === "gf";

        function getTime() {
            const hour = new Date().getHours();

            if (hour < 12) {
                return "morning";
            } else if (hour < 17) {
                return "afternoon";
            } else if (hour < 24) {
                return "evening";
            }
        }
        
        function getName() {
            return user.username;
        }

        document.getElementById("greet").textContent = "Good " + getTime() + ", " + getName() + " 👋";
        document.getElementById("greetsub").textContent = "Here are your tasks for this " + getTime() + ".";

        const partnername = document.getElementById("partnername")
        const partnerstatus = document.getElementById("partnerstatus")

        async function updatePartnerStatus() {
            const { data: users, error } = await supabase
                .from('users')
                .select('username, role, last_seen')
                .neq('role', user.role)

            if (error) {
                console.log("Error fetching partner:", error)
                return
            }

            if (users && users.length > 0) {
                const partner = users[0]

                partnername.innerText = partner.username;

                const online = isOnline(partner.last_seen);

                if (online) {
                    partnerstatus.innerText = "online";
                    partnerstatus.style.color = "#4ade80";
                } else {
                    partnerstatus.innerText = "offline";
                    partnerstatus.style.color = "#f87171";
                }
            }
        }

        function updateOnlineStatus() {
            fetch(`https://wfsnvttpktwwelsjghqf.supabase.co/rest/v1/users?id=eq.${user.id}`, {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json",
                    "apikey": "sb_publishable_ymCf8rQ5UaHKzOLSa_5srA_R-g9thvB"
                },
                body: JSON.stringify({ online: true })
            })
        }

        updatePartnerStatus()
        updateOnlineStatus()
        loadTasks()
        loadStats()
        setInterval(updatePartnerStatus, 3000)
        setInterval(updateOnlineStatus, 3000)

        let editingTaskItem = null;

        function toLocalDatetimeInput(date) {
            const offset = date.getTimezoneOffset() * 60000;
            return new Date(date - offset).toISOString().slice(0, 16);
        }

        function openPanel(taskItem = null) {
            // Guard against being called as an event handler (e.g. addEventListener passes event)
            if (taskItem && taskItem.target !== undefined && taskItem.currentTarget !== undefined) {
                taskItem = null;
            }

            if (taskItem && taskItem.querySelector) {
                editingTaskItem = taskItem;
            }

            const panelHeading = document.querySelector('.panel-header h2');
            const submitBtn = document.getElementById('panelSubmitBtn');

            if (editingTaskItem) {
                panelHeading.innerText = '✦ Edit Task';
                submitBtn.innerText = 'Edit Task';
                const currentText = editingTaskItem.querySelector('.task-text')?.innerText || '';
                document.getElementById('taskTitle').value = currentText;
                const currentDesc = editingTaskItem.dataset.description || '';
                document.getElementById('taskDesc').value = currentDesc;
                const rawDeadline = editingTaskItem.dataset.deadline || '';
                const currentDeadline = rawDeadline ? toLocalDatetimeInput(new Date(rawDeadline)) : '';
                document.getElementById('taskDate').value = currentDeadline;
            } else {
                editingTaskItem = null;
                panelHeading.innerText = '✦ New Task';
                submitBtn.innerText = 'Add Task';
                document.getElementById('taskTitle').value = '';
                document.getElementById('taskDesc').value = '';
                document.getElementById('taskDate').value = '';
            }

            document.getElementById('panelOverlay').classList.add('show');
            setTimeout(() => document.getElementById('taskTitle').focus(), 50);
        }

        function closePanel() {
            editingTaskItem = null;
            document.getElementById('panelOverlay').classList.remove('show');
        }

        function handleOverlayClick(e) {
            if (e.target === document.getElementById('panelOverlay')) closePanel();
        }

        async function toggleTask(el, id) {
            el.classList.toggle('done');

            const isDone = el.classList.contains('done');
            const field = isBF ? "donebybf" : "donebygf";

            await supabase
                .from("tasks")
                .update({ [field]: isDone })
                .eq("id", id);

            loadStats();
        }

        async function loadTasks() {
            const { data, error } = await supabase.from("tasks").select("*").order("created_at", { ascending: false });
            if (error) { console.log(error); return; }

            const taskList = document.getElementById('taskList');
            taskList.innerHTML = '';

            data.forEach(task => {
                const isDone = isBF ? task.donebybf : task.donebygf;
                const item   = document.createElement('div');
                item.className       = 'task-item';
                item.dataset.id          = task.id;
                item.dataset.description = task.description || '';
                item.dataset.deadline    = task.deadline    || '';
                item.innerHTML = `
                    <div class="task-check ${isDone ? 'done' : ''}" onclick="toggleTask(this,'${task.id}')"></div>
                    <span class="task-text" title="${task.title}">${task.title}</span>
                    <button class="task-edit"   onclick="editTask(this,'${task.id}')">✎</button>
                    <button class="task-delete"  onclick="deleteTask(this,'${task.id}')">✕</button>
                `;
                taskList.appendChild(item);
            });
        }

        async function loadStats() {
            const { data, error } = await supabase
                .from("tasks")
                .select("*");

            if (error) {
                console.log(error);
                return;
            }

            const now = new Date();

            // start of week (Sunday)
            const start = new Date(now);
            start.setDate(now.getDate() - now.getDay());
            start.setHours(0,0,0,0);

            let finished = 0;
            let unfinished = 0;
            let deadlines = 0;

            data.forEach(task => {
                const isDone = isBF ? task.donebybf : task.donebygf;

                // ❌ unfinished
                if (!isDone) {
                    unfinished++;
                }

                // ✅ finished THIS WEEK
                if (isDone && task.created_at) {
                    const created = new Date(task.created_at);
                    if (created >= start) {
                        finished++;
                    }
                }

                // 💀 deadlines THIS WEEK
                if (task.deadline) {
                    const d = new Date(task.deadline);

                    const end = new Date(start);
                    end.setDate(start.getDate() + 7);

                    if (d >= start && d <= end) {
                        deadlines++;
                    }
                }
            });

            /** remove if it fails **/
            await supabase
            .from("stats")
            .update({
                tasks_finished: finished,
                tasks_unfinished: unfinished,
                deadlines: deadlines
            })
            .eq("role", user.role);
            //until here

            // update UI
            document.getElementById("statFinished").innerText = finished;
            document.getElementById("statUnfinished").innerText = unfinished;
            document.getElementById("statDeadlines").innerText = deadlines;
        }

        async function submitTask() {
            const title = document.getElementById('taskTitle').value.trim();
            const desc = document.getElementById('taskDesc').value.trim();
            const dateLocal = document.getElementById('taskDate').value;
            const deadline = dateLocal ? new Date(dateLocal).toISOString() : null;

            if (!title) {
                alert("Enter a title");
                return;
            }

            // 🟡 EDIT MODE
            if (editingTaskItem) {
                const id = editingTaskItem.dataset.id;

                const { error } = await supabase
                    .from("tasks")
                    .update({
                        title: title,
                        description: desc,
                        deadline: deadline
                    })
                    .eq("id", id);

                if (error) console.log(error);

                editingTaskItem = null;
                closePanel();
                loadTasks();
                return;
            }

            // 🟢 CREATE MODE
            const { error } = await supabase
                .from("tasks")
                .insert([{
                    title: title,
                    description: desc,
                    deadline: deadline,
                    created_at: new Date().toISOString(),
                    donebybf: false,
                    donebygf: false,
                }]);

            if (error) {
                console.log(error);
                return;
            }

            closePanel();
            loadTasks();
            loadStats();
        }

        async function deleteTask(button, id) {
            await supabase
                .from("tasks")
                .delete()
                .eq("id", id);

            button.closest('.task-item').remove();
            loadStats();
        }

        async function editTask(button, id) {
            const item = button.closest('.task-item');
            const taskId = id || item?.dataset?.id;
            if (!taskId) return;

            const { data, error } = await supabase
                .from("tasks")
                .select("*")
                .eq("id", taskId)
                .single();

            if (error) {
                console.log(error);
                return;
            }

            editingTaskItem = item;

            document.getElementById('taskTitle').value = data.title;
            document.getElementById('taskDesc').value = data.description || "";
            document.getElementById('taskDate').value = data.deadline ? toLocalDatetimeInput(new Date(data.deadline)) : "";

            openPanel(item);
        }

        // Expose module functions to inline `onclick` attributes
        window.openPanel = openPanel;
        window.closePanel = closePanel;
        window.handleOverlayClick = handleOverlayClick;
        window.toggleTask = toggleTask;
        window.submitTask = submitTask;
        window.deleteTask = deleteTask;
        window.editTask = editTask;

        document.querySelectorAll('.see-all').forEach(el => {
            if (el.textContent.includes('Add new')) el.addEventListener('click', () => openPanel());
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closePanel();
        });

        setInterval(() => {
